version: "3.8"

# Inhouse-Bitrise — staging stack
# Exposes only the API (5002) and web (5174) to the host; Postgres is internal-only.

services:
  db:
    image: postgres:16-alpine
    container_name: inhouse-bitrise-staging-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-inhouse-bitrise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inhouse-bitrise}
      POSTGRES_DB: ${DB_NAME:-inhouse_bitrise_db}
    volumes:
      - inhouse_bitrise_pgdata:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inhouse-bitrise} -d ${DB_NAME:-inhouse_bitrise_db}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    container_name: inhouse-bitrise-staging-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inhouse_bitrise_db}
      DB_USER: ${DB_USER:-inhouse-bitrise}
      DB_PASSWORD: ${DB_PASSWORD:-inhouse-bitrise}
      JWT_SECRET: ${JWT_SECRET:-staging_change_me_please}
      JWT_EXPIRES_IN: 7d
      RUNNER_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://your-staging-domain.com:5174}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
    ports:
      - "5002:5001"
    volumes:
      - ./backend/public/artifacts:/app/public/artifacts

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://your-staging-domain.com:5002}
    container_name: inhouse-bitrise-staging-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  inhouse_bitrise_pgdata:
